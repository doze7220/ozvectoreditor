<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ Vector Editor</title>
    <style>
        /* 画面の領域の寸法の唯一の定義箇所（ツールバー・ステータスバー・キャンバスの領域・フロートウィンドウの既定の位置の基準）。
           定規を足すとき（Phase 07-03）に直すのは、--canvas-area-top（ツールバー＋定規の高さ）と--canvas-area-left（定規の幅）の2行だけで、
           --canvas-area-width・--canvas-area-heightとフロートウィンドウの既定の位置の基準はそれに追従する */
        :root {
            --toolbar-height: 40px;          /* ツールバーの高さ（1行固定） */
            --statusbar-height: 28px;        /* ステータスバーの高さ（1行固定） */
            /* キャンバスの領域（07-03で定規を足すときに直すのは--canvas-area-topと--canvas-area-leftの2行。幅・高さはそれに追従する） */
            --canvas-area-top: var(--toolbar-height);
            --canvas-area-left: 0px;
            --canvas-area-width: calc(100vw - var(--canvas-area-left));
            --canvas-area-height: calc(100vh - var(--canvas-area-top) - var(--statusbar-height));
            /* フロートウィンドウの既定の位置の基準（キャンバスの領域の左上から余白を空ける） */
            --float-window-margin: 8px;
            --float-window-top: calc(var(--canvas-area-top) + var(--float-window-margin));
            --float-window-left: calc(var(--canvas-area-left) + var(--float-window-margin));
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9f9f9;
        }
        /* キャンバスと読み込み中の覆い要素を、同じキャンバスの領域（ツールバーとステータスバーの間）に置く。
           <canvas>は置換要素のためleftとrightを両方指定しても伸びず、width/heightをCSSで明示する必要がある。
           キャンバスに枠線・内側の余白を付けてはならない（InputTracker.getScreenCoordinateのclientWidthとrect.widthの比がずれ、座標がずれる） */
        #editor-canvas, .canvas-loading-cover {
            position: fixed;
            top: var(--canvas-area-top);
            left: var(--canvas-area-left);
            width: var(--canvas-area-width);
            height: var(--canvas-area-height);
        }
        #editor-canvas {
            z-index: 1;
            background-color: #ffffff;
        }
        /* ツールバー（上端）とステータスバー（下端）の共通。画面に固定する枠（フロートウィンドウではない）で、1行固定。
           収まらない右側の項目は画面の外へ切れる（折り返し・横スクロールはしない）。
           重なりはキャンバス（1）・覆い要素（5）より前面（8）・フロートウィンドウ（10以上）より背面のため、読み込み中も押せ、フロートウィンドウはその上へ動かせる */
        .toolbar, .status-bar {
            position: fixed;
            left: 0;
            right: 0;
            box-sizing: border-box;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            z-index: 8;
            background-color: #f0f0f0;
            font-family: sans-serif;
            user-select: none;
        }
        /* ツールバー（上端。高さは--toolbar-heightで固定）。項目はまとまり（.toolbar-group）ごとに足す */
        .toolbar {
            top: 0;
            height: var(--toolbar-height);
            padding: 0 8px;
            border-bottom: 1px solid #ccc;
        }
        /* ツールバーの項目のまとまり（縮まない。収まらないときはまとまりごと右側から切れる） */
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: none;
        }
        /* まとまりの間の区切り（左の罫線と余白。区切りの要素は置かず、まとまりを足すだけで付く） */
        .toolbar-group + .toolbar-group {
            border-left: 1px solid #ccc;
            margin-left: 8px;
            padding-left: 8px;
        }
        /* ステータスバー（下端。高さは--statusbar-heightで固定）。左側・右側（.status-bar-side）を両端に寄せる */
        .status-bar {
            bottom: 0;
            height: var(--statusbar-height);
            padding: 0 8px;
            border-top: 1px solid #ccc;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
        }
        /* ステータスバーの左側・右側（中に.status-bar-groupを足す） */
        .status-bar-side {
            display: flex;
            align-items: center;
        }
        /* 左側：残りの幅を使い、縮められる（キャンバスの名前が省略表示で先に縮む） */
        .status-bar-left {
            flex: 1 1 auto;
            min-width: 0;
        }
        /* 右側：縮まない。収まらないときは画面の外へ切れる */
        .status-bar-right {
            flex: none;
            margin-left: 8px;
        }
        /* ステータスバーの項目のまとまり */
        .status-bar-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* まとまりの間の区切り（左の罫線と余白） */
        .status-bar-group + .status-bar-group {
            border-left: 1px solid #ccc;
            margin-left: 8px;
            padding-left: 8px;
        }
        /* 左側のまとまりは縮められる（中の名前が省略表示されるように） */
        .status-bar-left > .status-bar-group {
            flex: 0 1 auto;
            min-width: 0;
        }
        /* 共通フロートウィンドウ規格（WindowManagerの管理対象）: 個々のウィンドウはこのクラス群に準拠する */
        .float-window {
            position: fixed;
            z-index: 10;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: -2px 0 6px rgba(0,0,0,0.1);
            font-family: sans-serif;
            user-select: none;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            min-height: 18px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            background-color: #f0f0f0;
            cursor: move;
        }
        .window-title {
            flex: 1;
        }
        .window-close-btn {
            border: none;
            background: none;
            font-size: 14px;
            line-height: 1;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
        }
        .window-close-btn:hover {
            color: #333;
        }
        .window-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* ツールパレット（静的に置き常に表示。×なし・見出しの文字なし。常に押せる＝半透明にしない）。
           キャンバスの領域の左上に置く（top: --float-window-top＝ツールバーの下端40px＋余白8px＝48px、left: 余白8px）。
           幅44px（ボタン32px＋.window-bodyの左右の余白6px×2）。1280×800での範囲はx 8〜54、y 48〜約354
           （見出し約39px＋本体約265px＋枠2px）で、ステータスバーの上端772pxより上。
           ?devの確認用ウィンドウ（left: 62px）・プロパティパネル・キャンバスパレットとは横方向で離れているため重ならない */
        #window-tool-palette {
            top: var(--float-window-top);
            left: var(--float-window-left);
            width: 44px;
        }
        #window-tool-palette .window-body {
            padding: 6px;
            gap: 0;
        }
        /* ツールパレットのツールのまとまり（縦並び）。「選択・キャンバス移動」と「図形」の2つ */
        .tool-palette-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* まとまりの間の区切り（上の罫線と余白。区切りの要素は置かず、まとまりを足すだけで付く） */
        .tool-palette-group + .tool-palette-group {
            border-top: 1px solid #ddd;
            margin-top: 4px;
            padding-top: 4px;
        }
        .tool-btn {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fafafa;
            cursor: pointer;
            text-align: left;
        }
        /* 押せる状態のボタンのみホバー色を変える（押せない状態＝:disabledでは色を変えない） */
        .tool-btn:hover:not(:disabled) {
            background-color: #eee;
        }
        /* ボタン単体の押せない状態（HTMLのdisabled属性。例：選択集合が空の削除ボタン） */
        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .tool-btn.active {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* アイコンのみのボタン（.tool-btnと併用。押し込み・押せない・ホバーの見た目は.tool-btnのルールを使い、大きさと中央寄せだけを上書きする。
           ツールバー・ツールパレットは32×32。アイコンはindex.htmlのボタンの中身の文字だけに書く） */
        .icon-btn {
            box-sizing: border-box;
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            font-size: 16px;
            line-height: 1;
            text-align: center;
        }
        /* ステータスバー（高さ28px）の中のアイコンのボタンは24×24 */
        .status-bar .icon-btn {
            width: 24px;
            height: 24px;
            font-size: 14px;
        }
        /* ステータスバーの左側の開いているキャンバスの名前の表示。
           長い名前は省略表示し（min-width: 0で縮められる）、名前全体はmain.jsがtitle属性に設定する */
        .canvas-name-display {
            min-width: 0;
            font-size: 12px;
            line-height: 18px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* キャンバスパレット（ツールバーの呼び出し口#launcher-canvasで開閉。hidden属性で初期非表示）。
           キャンバスの領域の右上に置く（top: ツールバーの下の--float-window-top＝48px、right: 余白8px、幅240px）。
           1280×800での範囲はx 1030〜1272、y 48〜約565（一覧の最大240pxを含む見積もり）で、ステータスバーの上端772pxより上。
           ツールパレット（x 8〜54）・?devの確認用ウィンドウ（left: 62px・幅360px）とは、画面幅が約670px以上なら重ならない */
        #window-canvas-palette {
            top: var(--float-window-top);
            right: var(--float-window-margin);
            width: 240px;
        }
        /* キャンバスパレットの一覧（キャンバス数が多い場合はパレット内で縦スクロールする） */
        .canvas-list {
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* 一覧の1行（名前のボタン＋名前の変更・削除の小さなボタンを横並び） */
        .canvas-row {
            display: flex;
            gap: 4px;
        }
        /* 行の名前のボタン（押すと開く）。残りの幅を使い、長い名前は省略表示する（名前全体はtitle属性） */
        .canvas-row-open {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 行の名前の変更（✎）・削除（🗑）の小さなボタン（伸縮させない。押せない状態は.tool-btn:disabledを用いる） */
        .canvas-row-btn {
            flex: none;
        }
        /* 開いているキャンバスの行の名前のボタン（.tool-btn.activeと同じ配色） */
        .canvas-row.current .canvas-row-open {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* キャンバスパレットのファイル操作の行（開く・インポートの2ボタンを横並び）。
           パレットの内側は216px（幅240px−余白24px）。文字13px×(2+5)字＋余白・枠20px＋間隔4pxで約115pxのため1行に収まる。
           出力（作業ファイル）・出力（エンジン用）の2ボタンは、文字13px×(10+9)字＝約247px＞216pxで1行に収まらないため、この行には入れず1行に1つずつ置く */
        .canvas-file-row {
            display: flex;
            gap: 4px;
        }
        .canvas-file-row .tool-btn {
            flex: 1 1 auto;
            padding: 8px 4px;
            text-align: center;
            white-space: nowrap;
        }
        /* キャンバスパレットの保存・読み込みの問題（#canvas-notice）とファイル操作の通知（#canvas-file-notice）の短い文言
           （無いときはhidden属性で非表示）。区切りの無い長いファイル名がパレットからはみ出さないよう、どこでも折り返す */
        .canvas-notice {
            margin: 0;
            font-size: 12px;
            color: #b00020;
            overflow-wrap: anywhere;
        }
        /* 読み込み中の覆い要素（キャンバスの領域だけを覆い、読み込み完了までキャンバスへのマウス入力を遮る。位置と大きさは上のまとめたルール）。
           表示状態で始まり（main.jsの実行前から遮るため）、main.jsのsyncLoadingCover()が読み込み完了でhidden属性を付けて非表示にする。
           z-index: 5はキャンバス（1）より前面・ツールバー・ステータスバー（8）・フロートウィンドウ（10以上。最前面化でも下がらない）より背面のため、
           ツールバー・ステータスバー・ツールパレット・キャンバスパレット・プロパティパネル・?devの確認用ウィンドウは読み込み中も操作できる */
        .canvas-loading-cover {
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 14px;
            color: #666;
            cursor: progress;
            user-select: none;
        }
        /* 必須：上のdisplay: flexがhidden属性の既定の非表示（display: none）を上書きするため、hidden時の非表示を明示する */
        .canvas-loading-cover[hidden] {
            display: none;
        }
        /* プロパティパネル（静的に置き常に表示。×なし。.disabledは使わない）。
           開いた状態のキャンバスパレットの左隣に置く（right: 余白8px＋キャンバスパレット幅240px＋枠2px＋余白8px＝258px）。
           ツールパレット（左端から8〜54px）・開いた状態のキャンバスパレット（右端から8〜250px）とは
           横方向で離れているため、各ウィンドウの高さによらず重ならない。
           ?devの確認用ウィンドウ（left: 62px・幅360px＝左端から424px）とは、画面幅が258＋220＋424＝902px以上なら重ならない
           （プロパティパネルの右端は右端から258〜478px。1280×800ではx 800〜1022で、?devの右端424pxと重ならない）。
           パネル自身は1280×800に収まる（幅は258＋220＝478＜1280、高さは約330px・y 48〜約378で、ステータスバーの上端772pxより上。
           「図形」の段約200pxに「重なり順」の段約127pxを足した見積もり） */
        #window-property-panel {
            top: var(--float-window-top);
            right: 258px;
            width: 220px;
        }
        /* プロパティパネルの段（段ごとに1つの<section>。縦並び） */
        .property-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* 段の間の区切り（上の罫線と余白）。「図形」と「重なり順」の段の間に効く */
        .property-section + .property-section {
            border-top: 1px solid #ddd;
            padding-top: 12px;
            margin-top: 4px;
        }
        .property-section-title {
            margin: 0;
            font-size: 13px;
            color: #333;
        }
        /* 表示の対象（「選択中：n個」／「次に描く図形」） */
        .property-source {
            font-size: 12px;
            color: #666;
        }
        .property-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #333;
        }
        .property-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 52px;
            cursor: pointer;
        }
        .property-label {
            min-width: 52px;
        }
        .property-note {
            font-size: 11px;
            color: #888;
        }
        .property-unit {
            font-size: 12px;
            color: #666;
        }
        /* 太さの欄（.float-windowのuser-select: noneは変えず、この欄に限り文字の選択を許可する） */
        #property-stroke-width {
            width: 56px;
            box-sizing: border-box;
            user-select: text;
        }
        .property-row input[type="color"] {
            width: 36px;
            height: 24px;
            padding: 0;
        }
        /* プロパティパネルの「重なり順」の段の4ボタン（2×2。内側196pxを間隔8pxで2等分＝各94px。最長の4字のボタンは約74pxで収まる） */
        .order-button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .order-button-grid .tool-btn {
            text-align: center;
            white-space: nowrap;
        }
        /* 開発者向け確認用ウィンドウ（?dev時のみ表示。ツールパレットの右隣に置く。
           left: ツールパレットの左の位置に54px（ツールパレット幅44px＋枠2px＋余白8px）を足す。1280×800ではx 62〜424、y 48〜。
           ツールパレット（x 8〜54）とは重ならない。プロパティパネルとは画面幅が約902px未満で重なり得る（許容） */
        #window-dev-panel {
            top: var(--float-window-top);
            left: calc(var(--float-window-left) + 54px);
            width: 360px;
        }
        .dev-button-row {
            display: flex;
            gap: 8px;
        }
        /* .float-windowのuser-select: noneは変更せず、テキスト欄・結果表示欄に限って文字の選択を許可する */
        #dev-json {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            user-select: text;
        }
        #dev-result {
            margin: 0;
            max-height: 120px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            user-select: text;
        }
    </style>
</head>
<body>
    <canvas id="editor-canvas"></canvas>
    <div id="canvas-loading-cover" class="canvas-loading-cover">読み込み中…</div>
    <header id="toolbar" class="toolbar">
        <div class="toolbar-group">
            <button type="button" id="launcher-canvas" class="tool-btn icon-btn" title="キャンバスパレットを開く／閉じる">📁</button>
        </div>
        <div class="toolbar-group">
            <button type="button" id="history-undo" class="tool-btn icon-btn" title="取り消し (Ctrl+Z)" disabled>↶</button>
            <button type="button" id="history-redo" class="tool-btn icon-btn" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷</button>
        </div>
        <div class="toolbar-group">
            <button type="button" id="selection-delete" class="tool-btn icon-btn" title="選択中の図形を削除 (Delete / Backspace)" disabled>🗑</button>
            <button type="button" id="selection-join" class="tool-btn icon-btn" title="選択中の線を結合 (J)" disabled>🔗</button>
        </div>
    </header>
    <footer id="status-bar" class="status-bar">
        <div class="status-bar-side status-bar-left">
            <div class="status-bar-group">
                <div id="canvas-name-display" class="canvas-name-display"></div>
            </div>
        </div>
        <div class="status-bar-side status-bar-right">
            <div class="status-bar-group">
                <span id="view-zoom-display">100%</span>
                <button type="button" id="view-reset" class="tool-btn icon-btn" title="表示をリセット (Ctrl+0)">🎯</button>
            </div>
        </div>
    </footer>
    <div id="window-tool-palette" class="float-window">
        <div class="window-header"></div>
        <div class="window-body">
            <div class="tool-palette-group">
                <button type="button" id="tool-select" class="tool-btn icon-btn active" title="選択 (V)">🖱</button>
                <button type="button" id="tool-pan" class="tool-btn icon-btn" title="キャンバス移動 (H)">✋</button>
            </div>
            <div class="tool-palette-group">
                <button type="button" id="tool-line" class="tool-btn icon-btn" title="直線 (1)">／</button>
                <button type="button" id="tool-curve" class="tool-btn icon-btn" title="曲線 (2)">〜</button>
                <button type="button" id="tool-arc" class="tool-btn icon-btn" title="弧 (3)">◠</button>
                <button type="button" id="tool-rect" class="tool-btn icon-btn" title="矩形 (4)">▭</button>
                <button type="button" id="tool-circle" class="tool-btn icon-btn" title="円 (5)">◯</button>
            </div>
        </div>
    </div>
    <div id="window-canvas-palette" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">キャンバス</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="canvas-create" class="tool-btn">＋ 新規作成</button>
            <button type="button" id="canvas-export" class="tool-btn" title="エディタで開き直すための作業データを、ファイル（.ozve.json）としてダウンロードします">出力（作業ファイル）</button>
            <button type="button" id="canvas-export-sprite" class="tool-btn" title="ゲームで使うスプライトを、JS（.js）のファイルとしてダウンロードします">出力（エンジン用）</button>
            <div class="canvas-file-row">
                <button type="button" id="canvas-open-file" class="tool-btn" title="作業ファイル（.ozve.json）、またはエンジン用に出力したスプライト（.js）を新しいキャンバスとして開きます">開く</button>
                <button type="button" id="canvas-import" class="tool-btn" title="作業ファイル（.ozve.json）、またはエンジン用に出力したスプライト（.js）の図形を、開いているキャンバスへ追加します">インポート</button>
            </div>
            <input type="file" id="canvas-open-file-input" accept=".json,.js,application/json,text/javascript" hidden>
            <input type="file" id="canvas-import-file-input" accept=".json,.js,application/json,text/javascript" hidden>
            <div id="canvas-list" class="canvas-list"></div>
            <p id="canvas-notice" class="canvas-notice" hidden></p>
            <p id="canvas-file-notice" class="canvas-notice" hidden></p>
        </div>
    </div>
    <div id="window-property-panel" class="float-window">
        <div class="window-header">
            <span class="window-title">プロパティ</span>
        </div>
        <div class="window-body">
            <section id="property-shape-section" class="property-section">
                <h3 class="property-section-title">図形</h3>
                <div id="property-shape-source" class="property-source"></div>
                <div class="property-row">
                    <label class="property-toggle"><input type="checkbox" id="property-stroke-enabled"> 線</label>
                    <input type="color" id="property-stroke-color" title="線の色">
                    <span id="property-stroke-color-note" class="property-note"></span>
                </div>
                <div class="property-row">
                    <label for="property-stroke-width" class="property-label">太さ</label>
                    <input type="number" id="property-stroke-width" min="1" max="100" step="1" title="線の太さ（1〜100の整数）">
                    <span class="property-unit">px</span>
                </div>
                <div class="property-row">
                    <label class="property-toggle"><input type="checkbox" id="property-fill-enabled"> 塗り</label>
                    <input type="color" id="property-fill-color" title="塗りの色">
                    <span id="property-fill-color-note" class="property-note"></span>
                </div>
            </section>
            <section id="property-order-section" class="property-section">
                <h3 class="property-section-title">重なり順</h3>
                <div class="order-button-grid">
                    <button type="button" id="order-bring-to-front" class="tool-btn" title="最前面へ (Home)" disabled>最前面へ</button>
                    <button type="button" id="order-bring-forward" class="tool-btn" title="前へ (PageUp)" disabled>前へ</button>
                    <button type="button" id="order-send-backward" class="tool-btn" title="後ろへ (PageDown)" disabled>後ろへ</button>
                    <button type="button" id="order-send-to-back" class="tool-btn" title="最背面へ (End)" disabled>最背面へ</button>
                </div>
            </section>
        </div>
    </div>
    <div id="window-dev-panel" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">開発者用：作業データ</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <div class="dev-button-row">
                <button type="button" id="dev-export" class="tool-btn">JSONへ変換</button>
                <button type="button" id="dev-import" class="tool-btn">JSONから復元</button>
            </div>
            <textarea id="dev-json" rows="14" spellcheck="false"></textarea>
            <pre id="dev-result"></pre>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
