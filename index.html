<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ Vector Editor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9f9f9;
        }
        #editor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: #ffffff;
        }
        /* 共通フロートウィンドウ規格（WindowManagerの管理対象）: 個々のウィンドウはこのクラス群に準拠する */
        .float-window {
            position: fixed;
            z-index: 10;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: -2px 0 6px rgba(0,0,0,0.1);
            font-family: sans-serif;
            user-select: none;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            background-color: #f0f0f0;
            cursor: move;
        }
        .window-title {
            flex: 1;
        }
        .window-close-btn {
            border: none;
            background: none;
            font-size: 14px;
            line-height: 1;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
        }
        .window-close-btn:hover {
            color: #333;
        }
        .window-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #window-control-panel {
            top: 16px;
            right: 16px;
            width: 220px;
        }
        #window-shape-palette {
            top: 320px;
            right: 16px;
            width: 220px;
        }
        /* SELECTモード中など非活性化させたい.float-windowに付与する（クリック不可＋半透明化） */
        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .tool-btn {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fafafa;
            cursor: pointer;
            text-align: left;
        }
        .tool-btn:hover {
            background-color: #eee;
        }
        .tool-btn.active {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* コントロールパネルの表示倍率行（倍率表示＋リセットボタン） */
        .view-zoom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>
<body>
    <canvas id="editor-canvas"></canvas>
    <div id="window-control-panel" class="float-window">
        <div class="window-header">
            <span class="window-title">OZ Vector Editor</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="mode-select" class="tool-btn active">🖱 選択</button>
            <button type="button" id="mode-create" class="tool-btn">✏ 図形作成</button>
            <button type="button" id="mode-pan" class="tool-btn">✋ キャンバス移動</button>
            <div class="view-zoom-row">
                <span id="view-zoom-display">100%</span>
                <button type="button" id="view-reset" class="tool-btn">リセット</button>
            </div>
        </div>
    </div>
    <div id="window-shape-palette" class="float-window disabled">
        <div class="window-header">
            <span class="window-title">図形選択パレット</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="palette-line" class="tool-btn">／ 直線</button>
            <button type="button" id="palette-curve" class="tool-btn">〜 曲線</button>
            <button type="button" id="palette-arc" class="tool-btn">◠ 弧</button>
            <button type="button" id="palette-rect" class="tool-btn">▭ 矩形</button>
            <button type="button" id="palette-circle" class="tool-btn">◯ 円</button>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
