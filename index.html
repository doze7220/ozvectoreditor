<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ Vector Editor</title>
    <style>
        /* 画面の領域の寸法の唯一の定義箇所（ツールバー・ステータスバー・定規・キャンバスの領域・フロートウィンドウの既定の位置の基準）。
           キャンバスの領域は、ツールバー・横の定規の下、縦の定規の右、ステータスバーの上（定規の太さ--ruler-sizeの分だけ狭い）。
           --canvas-area-width・--canvas-area-heightとフロートウィンドウの既定の位置の基準はそれに追従する */
        :root {
            --toolbar-height: 40px;          /* ツールバーの高さ（1行固定） */
            --statusbar-height: 28px;        /* ステータスバーの高さ（1行固定） */
            --ruler-size: 20px;              /* 定規の太さ（横の定規の高さ・縦の定規の幅。唯一の定義箇所） */
            /* ツールバー・ステータスバー・定規・定規の角の地の色（1か所で共有する） */
            --frame-background-color: #f0f0f0;
            /* キャンバスの領域（上端＝ツールバー＋横の定規、左端＝縦の定規の幅。幅・高さはそれに追従する） */
            --canvas-area-top: calc(var(--toolbar-height) + var(--ruler-size));
            --canvas-area-left: var(--ruler-size);
            --canvas-area-width: calc(100vw - var(--canvas-area-left));
            --canvas-area-height: calc(100vh - var(--canvas-area-top) - var(--statusbar-height));
            /* フロートウィンドウの既定の位置の基準（キャンバスの領域の左上から余白を空ける） */
            --float-window-margin: 8px;
            --float-window-top: calc(var(--canvas-area-top) + var(--float-window-margin));
            --float-window-left: calc(var(--canvas-area-left) + var(--float-window-margin));
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9f9f9;
        }
        /* キャンバスと読み込み中の覆い要素を、同じキャンバスの領域（ツールバー・横の定規とステータスバーの間、縦の定規の右）に置く。
           <canvas>は置換要素のためleftとrightを両方指定しても伸びず、width/heightをCSSで明示する必要がある。
           キャンバスに枠線・内側の余白を付けてはならない（InputTracker.getScreenCoordinateのclientWidthとrect.widthの比がずれ、座標がずれる） */
        #editor-canvas, .canvas-loading-cover {
            position: fixed;
            top: var(--canvas-area-top);
            left: var(--canvas-area-left);
            width: var(--canvas-area-width);
            height: var(--canvas-area-height);
        }
        /* 背景の色はCanvasManagerの配色の組で塗る（CSSでは付けない。色の定義を1か所にするため） */
        #editor-canvas {
            z-index: 1;
        }
        /* ツールバー（上端）とステータスバー（下端）の共通。画面に固定する枠（フロートウィンドウではない）で、1行固定。
           収まらない右側の項目は画面の外へ切れる（折り返し・横スクロールはしない）。
           重なりは定規と同じく、キャンバス（1）・覆い要素（5）より前面（8）・フロートウィンドウ（10以上）より背面のため、読み込み中も押せ、フロートウィンドウはその上へ動かせる */
        .toolbar, .status-bar {
            position: fixed;
            left: 0;
            right: 0;
            box-sizing: border-box;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            z-index: 8;
            background-color: var(--frame-background-color);
            font-family: sans-serif;
            user-select: none;
        }
        /* 定規（横・縦の<canvas>と左上の角の要素。画面に固定する枠で、フロートウィンドウではない）。
           地の色はここ（<canvas>は透明に消して目盛りだけを描く）。重なりはツールバー・ステータスバーと同じ（8）で、
           キャンバス・覆い要素より前面のため、定規の上の押下・ホイールはキャンバスへ届かない。
           キャンバスの座標と位置がずれるため、<canvas>に枠線・内側の余白を付けてはならない */
        .ruler {
            position: fixed;
            z-index: 8;
            background-color: var(--frame-background-color);
        }
        /* 横の定規（ツールバーの下。左端はキャンバスの領域の左端にそろえ、縦の定規の上には重ならない） */
        #ruler-horizontal {
            top: var(--toolbar-height);
            left: var(--canvas-area-left);
            width: var(--canvas-area-width);
            height: var(--ruler-size);
        }
        /* 縦の定規（横の定規の下。ステータスバーの上で終わる） */
        #ruler-vertical {
            top: var(--canvas-area-top);
            left: 0;
            width: var(--ruler-size);
            height: var(--canvas-area-height);
        }
        /* 定規の角（左上。何も描かない枠） */
        #ruler-corner {
            top: var(--toolbar-height);
            left: 0;
            width: var(--ruler-size);
            height: var(--ruler-size);
        }
        /* ツールバー（上端。高さは--toolbar-heightで固定）。項目はまとまり（.toolbar-group）ごとに足す */
        .toolbar {
            top: 0;
            height: var(--toolbar-height);
            padding: 0 8px;
            border-bottom: 1px solid #ccc;
        }
        /* ツールバーの項目のまとまり（縮まない。収まらないときはまとまりごと右側から切れる） */
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: none;
        }
        /* まとまりの間の区切り（左の罫線と余白。区切りの要素は置かず、まとまりを足すだけで付く） */
        .toolbar-group + .toolbar-group {
            border-left: 1px solid #ccc;
            margin-left: 8px;
            padding-left: 8px;
        }
        /* ステータスバー（下端。高さは--statusbar-heightで固定）。左詰めで並べ、右側（.status-bar-right）だけmargin-left: autoで右端へ寄せる */
        .status-bar {
            bottom: 0;
            height: var(--statusbar-height);
            padding: 0 8px;
            border-top: 1px solid #ccc;
            justify-content: flex-start;
            font-size: 12px;
            color: #333;
        }
        /* ステータスバーの左側・右側（中に.status-bar-groupを足す）。左側はこの後のルールでdisplay: contentsに上書きする */
        .status-bar-side {
            display: flex;
            align-items: center;
        }
        /* 左側：箱を作らない（display: contents）。中の.status-bar-groupが.status-bar直下のflexの項目として並ぶ。
           箱にすると入れ子のflexでは、子のwhite-space: nowrapの文字の全幅が左側の最小の幅に含まれて名前が縮まない
           （min-width: 0を付けると、名前が縮みきった後に縮まないまとまりが右側へはみ出して重なる）ため。
           これにより、幅が足りないときはまず名前のまとまり（.status-bar-group-shrink）だけが省略表示で縮み、
           それでも足りないと右側が右端から画面の外へ切れる（左側の表示は右側へ重ならない） */
        .status-bar-left {
            display: contents;
        }
        /* 右側：縮まない。margin-left: autoで右端へ寄せる。padding-leftは左側との最小の間隔。
           Phase 07-05で右側へまとまりを足すときは、中へ.status-bar-groupを足すだけでよい */
        .status-bar-right {
            flex: none;
            margin-left: auto;
            padding-left: 8px;
        }
        /* ステータスバーの項目のまとまり（既定は縮まない。縮められるのは.status-bar-group-shrinkだけ） */
        .status-bar-group {
            display: flex;
            flex: none;
            align-items: center;
            gap: 4px;
        }
        /* まとまりの間の区切り（左の罫線と余白） */
        .status-bar-group + .status-bar-group {
            border-left: 1px solid #ccc;
            margin-left: 8px;
            padding-left: 8px;
        }
        /* 縮められるまとまり（キャンバスの名前。中の名前が省略表示されるように） */
        .status-bar-group-shrink {
            flex: 0 1 auto;
            min-width: 0;
        }
        /* 座標・大きさ・グリッドの表示。white-space: nowrapは連続する空白を1つにまとめるため、項目の間の空白2つを保つ（pre）。
           最小の幅は想定の最大の桁数（X: -99999.9  Y: -99999.9＝24文字など）で、数字の桁が変わっても右側の項目が揺れないため。
           これを超える桁ではその分だけ伸びる */
        .status-readout {
            white-space: pre;
            font-variant-numeric: tabular-nums;
        }
        #cursor-readout { min-width: 24ch; }
        #selection-size-readout { min-width: 22ch; }
        #grid-size-readout { min-width: 17ch; }
        /* 共通フロートウィンドウ規格（WindowManagerの管理対象）: 個々のウィンドウはこのクラス群に準拠する */
        .float-window {
            position: fixed;
            z-index: 10;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: -2px 0 6px rgba(0,0,0,0.1);
            font-family: sans-serif;
            user-select: none;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            min-height: 18px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            background-color: #f0f0f0;
            cursor: move;
        }
        .window-title {
            flex: 1;
        }
        .window-close-btn {
            border: none;
            background: none;
            font-size: 14px;
            line-height: 1;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
        }
        .window-close-btn:hover {
            color: #333;
        }
        .window-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* ツールパレット（静的に置き常に表示。×なし・見出しの文字なし。常に押せる＝半透明にしない）。
           キャンバスの領域の左上に置く（top: --float-window-top＝ツールバー40px＋定規20px＋余白8px＝68px、left: 縦の定規20px＋余白8px＝28px）。
           幅44px（ボタン32px＋.window-bodyの左右の余白6px×2）。1280×800での範囲はx 28〜74、y 68〜約374
           （見出し約39px＋本体約265px＋枠2px）で、ステータスバーの上端772pxより上。
           ?devの確認用ウィンドウ（left: 82px）・キャンバスパレットとは横方向で離れているため重ならない */
        #window-tool-palette {
            top: var(--float-window-top);
            left: var(--float-window-left);
            width: 44px;
        }
        #window-tool-palette .window-body {
            padding: 6px;
            gap: 0;
        }
        /* ツールパレットのツールのまとまり（縦並び）。「選択・キャンバス移動」と「図形」の2つ */
        .tool-palette-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* まとまりの間の区切り（上の罫線と余白。区切りの要素は置かず、まとまりを足すだけで付く） */
        .tool-palette-group + .tool-palette-group {
            border-top: 1px solid #ddd;
            margin-top: 4px;
            padding-top: 4px;
        }
        .tool-btn {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fafafa;
            cursor: pointer;
            text-align: left;
        }
        /* 押せる状態のボタンのみホバー色を変える（押せない状態＝:disabledでは色を変えない） */
        .tool-btn:hover:not(:disabled) {
            background-color: #eee;
        }
        /* ボタン単体の押せない状態（HTMLのdisabled属性。例：選択集合が空の削除ボタン） */
        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .tool-btn.active, .tool-btn[aria-pressed="true"] {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* ON/OFFのボタン（aria-pressed）のそろっていない表示（破線の枠。押し込みの色は付けない。ON＝押し込みは上の.tool-btn.activeのルールを共有する） */
        .tool-btn[aria-pressed="mixed"] {
            border-style: dashed;
            border-color: #666;
        }
        /* アイコンのみのボタン（.tool-btnと併用。押し込み・押せない・ホバーの見た目は.tool-btnのルールを使い、大きさと中央寄せだけを上書きする。
           ツールバー・ツールパレットは32×32。アイコンはindex.htmlのボタンの中身の文字だけに書く） */
        .icon-btn {
            box-sizing: border-box;
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            font-size: 16px;
            line-height: 1;
            text-align: center;
        }
        /* ステータスバー（高さ28px）の中のアイコンのボタンは24×24 */
        .status-bar .icon-btn {
            width: 24px;
            height: 24px;
            font-size: 14px;
        }
        /* ステータスバーの左側の開いているキャンバスの名前の表示。
           長い名前は省略表示し（min-width: 0で縮められる）、名前全体はmain.jsがtitle属性に設定する */
        .canvas-name-display {
            min-width: 0;
            font-size: 12px;
            line-height: 18px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* キャンバスパレット（ツールバーの呼び出し口#launcher-canvasで開閉。hidden属性で初期非表示）。
           キャンバスの領域の右上に置く（top: 定規の下の--float-window-top＝68px、right: 余白8px、幅240px）。
           1280×800での範囲はx 1030〜1272、y 68〜約585（一覧の最大240pxを含む見積もり）で、ステータスバーの上端772pxより上。
           ツールパレット（x 28〜74）・?devの確認用ウィンドウ（left: 82px・幅360px）とは、画面幅が約700px以上なら重ならない */
        #window-canvas-palette {
            top: var(--float-window-top);
            right: var(--float-window-margin);
            width: 240px;
        }
        /* キャンバスパレットの一覧（キャンバス数が多い場合はパレット内で縦スクロールする） */
        .canvas-list {
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* 一覧の1行（名前のボタン＋名前の変更・削除の小さなボタンを横並び） */
        .canvas-row {
            display: flex;
            gap: 4px;
        }
        /* 行の名前のボタン（押すと開く）。残りの幅を使い、長い名前は省略表示する（名前全体はtitle属性） */
        .canvas-row-open {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 行の名前の変更（✎）・削除（🗑）の小さなボタン（伸縮させない。押せない状態は.tool-btn:disabledを用いる） */
        .canvas-row-btn {
            flex: none;
        }
        /* 開いているキャンバスの行の名前のボタン（.tool-btn.activeと同じ配色） */
        .canvas-row.current .canvas-row-open {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* キャンバスパレットのファイル操作の行（開く・インポートの2ボタンを横並び）。
           パレットの内側は216px（幅240px−余白24px）。文字13px×(2+5)字＋余白・枠20px＋間隔4pxで約115pxのため1行に収まる。
           出力（作業ファイル）・出力（エンジン用）の2ボタンは、文字13px×(10+9)字＝約247px＞216pxで1行に収まらないため、この行には入れず1行に1つずつ置く */
        .canvas-file-row {
            display: flex;
            gap: 4px;
        }
        .canvas-file-row .tool-btn {
            flex: 1 1 auto;
            padding: 8px 4px;
            text-align: center;
            white-space: nowrap;
        }
        /* キャンバスパレットの保存・読み込みの問題（#canvas-notice）とファイル操作の通知（#canvas-file-notice）の短い文言
           （無いときはhidden属性で非表示）。区切りの無い長いファイル名がパレットからはみ出さないよう、どこでも折り返す */
        .canvas-notice {
            margin: 0;
            font-size: 12px;
            color: #b00020;
            overflow-wrap: anywhere;
        }
        /* 読み込み中の覆い要素（キャンバスの領域だけを覆い、読み込み完了までキャンバスへのマウス入力を遮る。位置と大きさは上のまとめたルール）。
           表示状態で始まり（main.jsの実行前から遮るため）、main.jsのsyncLoadingCover()が読み込み完了でhidden属性を付けて非表示にする。
           z-index: 5はキャンバス（1）より前面・ツールバー・ステータスバー・定規（8）・フロートウィンドウ（10以上。最前面化でも下がらない）より背面のため、
           ツールバー（オプションバーを含む）・ステータスバー・定規・ツールパレット・キャンバスパレット・?devの確認用ウィンドウは読み込み中も操作できる */
        .canvas-loading-cover {
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 14px;
            color: #666;
            cursor: progress;
            user-select: none;
        }
        /* 必須：上のdisplay: flexがhidden属性の既定の非表示（display: none）を上書きするため、hidden時の非表示を明示する */
        .canvas-loading-cover[hidden] {
            display: none;
        }
        /* オプションバーの色の欄を包む要素（覆いと斜線の基準。ツールバーの高さ40pxに収まるよう欄は32×24px） */
        .option-color-frame {
            position: relative;
            display: inline-flex;
            flex: none;
        }
        .option-color-frame input[type="color"] {
            box-sizing: border-box;
            width: 32px;
            height: 24px;
            padding: 0;
        }
        /* 色の欄の「色を表示できない」表示（混在・表示できない色。2つは見た目を区別せずtitleで区別する）。
           グレーの地・赤の斜線の色と太さの唯一の定義箇所。欄の上に重ねるだけで幅を変えず（疑似要素は絶対配置）、マウスの操作は欄へ通す */
        .option-color-frame[data-color-note="mixed"]::after,
        .option-color-frame[data-color-note="unsupported"]::after {
            content: '';
            position: absolute;
            inset: 2px;
            pointer-events: none;
            background:
                linear-gradient(to bottom right,
                    transparent calc(50% - 1px), #e00000 calc(50% - 1px),
                    #e00000 calc(50% + 1px), transparent calc(50% + 1px)),
                #c8c8c8;
        }
        /* 線の太さの欄（.toolbarのuser-select: noneは変えず、この欄に限り文字の選択を許可する） */
        #option-stroke-width {
            box-sizing: border-box;
            width: 56px;
            height: 24px;
            user-select: text;
        }
        .option-unit {
            font-size: 12px;
            color: #666;
        }
        /* オプションバー（スタイル・重なり順の2つのまとまり）の幅の見積もり（1280px幅）：
           左右の余白16px＋既存3つのまとまり（32、68、68）＋区切り17px×4＋スタイル約218px＋重なり順140px＝約610px。
           幅が足りないときは右のまとまりから切れる（.toolbarのoverflow: hidden） */
        /* 開発者向け確認用ウィンドウ（?dev時のみ表示。ツールパレットの右隣に置く。
           left: ツールパレットの左の位置に54px（ツールパレット幅44px＋枠2px＋余白8px）を足す。1280×800ではx 82〜444、y 68〜。
           ツールパレット（x 28〜74）とは重ならない */
        #window-dev-panel {
            top: var(--float-window-top);
            left: calc(var(--float-window-left) + 54px);
            width: 360px;
        }
        .dev-button-row {
            display: flex;
            gap: 8px;
        }
        /* .float-windowのuser-select: noneは変更せず、テキスト欄・結果表示欄に限って文字の選択を許可する */
        #dev-json {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            user-select: text;
        }
        #dev-result {
            margin: 0;
            max-height: 120px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            user-select: text;
        }
    </style>
</head>
<body>
    <canvas id="editor-canvas"></canvas>
    <div id="canvas-loading-cover" class="canvas-loading-cover">読み込み中…</div>
    <canvas id="ruler-horizontal" class="ruler"></canvas>
    <canvas id="ruler-vertical" class="ruler"></canvas>
    <div id="ruler-corner" class="ruler"></div>
    <header id="toolbar" class="toolbar">
        <div class="toolbar-group">
            <button type="button" id="launcher-canvas" class="tool-btn icon-btn" title="キャンバスパレットを開く／閉じる">📁</button>
        </div>
        <div class="toolbar-group">
            <button type="button" id="history-undo" class="tool-btn icon-btn" title="取り消し (Ctrl+Z)" disabled>↶</button>
            <button type="button" id="history-redo" class="tool-btn icon-btn" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷</button>
        </div>
        <div class="toolbar-group">
            <button type="button" id="selection-delete" class="tool-btn icon-btn" title="選択中の図形を削除 (Delete / Backspace)" disabled>🗑</button>
            <button type="button" id="selection-join" class="tool-btn icon-btn" title="選択中の線を結合 (J)" disabled>🔗</button>
        </div>
        <div id="option-style-group" class="toolbar-group">
            <button type="button" id="option-stroke-toggle" class="tool-btn icon-btn" title="線のあり／なしを切り替え" aria-pressed="false">🖊</button>
            <span id="option-stroke-color-frame" class="option-color-frame"><input type="color" id="option-stroke-color" title="線の色"></span>
            <button type="button" id="option-fill-toggle" class="tool-btn icon-btn" title="塗りのあり／なしを切り替え" aria-pressed="false">🪣</button>
            <span id="option-fill-color-frame" class="option-color-frame"><input type="color" id="option-fill-color" title="塗りの色"></span>
            <input type="number" id="option-stroke-width" min="1" max="100" step="1" title="線の太さ（1〜100の整数）">
            <span class="option-unit">px</span>
        </div>
        <div id="option-order-group" class="toolbar-group">
            <button type="button" id="option-bring-to-front" class="tool-btn icon-btn" title="最前面へ (Home)" disabled>⏫</button>
            <button type="button" id="option-bring-forward" class="tool-btn icon-btn" title="前へ (PageUp)" disabled>🔼</button>
            <button type="button" id="option-send-backward" class="tool-btn icon-btn" title="後ろへ (PageDown)" disabled>🔽</button>
            <button type="button" id="option-send-to-back" class="tool-btn icon-btn" title="最背面へ (End)" disabled>⏬</button>
        </div>
    </header>
    <footer id="status-bar" class="status-bar">
        <div class="status-bar-side status-bar-left">
            <div class="status-bar-group status-bar-group-shrink">
                <div id="canvas-name-display" class="canvas-name-display"></div>
            </div>
            <div class="status-bar-group"><span id="cursor-readout" class="status-readout"></span></div>
            <div class="status-bar-group"><span id="selection-size-readout" class="status-readout"></span></div>
            <div class="status-bar-group"><span id="grid-size-readout" class="status-readout"></span></div>
        </div>
        <div class="status-bar-side status-bar-right">
            <div id="view-toggle-group" class="status-bar-group">
                <button type="button" id="view-outline-toggle" class="tool-btn icon-btn" title="アウトライン表示 (Z)">▢</button>
                <button type="button" id="view-background-toggle" class="tool-btn icon-btn" title="背景の白／黒を切り替え (X)">◐</button>
                <button type="button" id="view-grid-toggle" class="tool-btn icon-btn" title="グリッドの表示 (C)">▦</button>
            </div>
            <div class="status-bar-group">
                <span id="view-zoom-display">100%</span>
                <button type="button" id="view-reset" class="tool-btn icon-btn" title="表示をリセット (Ctrl+0)">🎯</button>
            </div>
        </div>
    </footer>
    <div id="window-tool-palette" class="float-window">
        <div class="window-header"></div>
        <div class="window-body">
            <div class="tool-palette-group">
                <button type="button" id="tool-select" class="tool-btn icon-btn active" title="選択 (V)">🖱</button>
                <button type="button" id="tool-pan" class="tool-btn icon-btn" title="キャンバス移動 (H)">✋</button>
            </div>
            <div class="tool-palette-group">
                <button type="button" id="tool-line" class="tool-btn icon-btn" title="直線 (1)">／</button>
                <button type="button" id="tool-curve" class="tool-btn icon-btn" title="曲線 (2)">〜</button>
                <button type="button" id="tool-arc" class="tool-btn icon-btn" title="弧 (3)">◠</button>
                <button type="button" id="tool-rect" class="tool-btn icon-btn" title="矩形 (4)">▭</button>
                <button type="button" id="tool-circle" class="tool-btn icon-btn" title="円 (5)">◯</button>
            </div>
        </div>
    </div>
    <div id="window-canvas-palette" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">キャンバス</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="canvas-create" class="tool-btn">＋ 新規作成</button>
            <button type="button" id="canvas-export" class="tool-btn" title="エディタで開き直すための作業データを、ファイル（.ozve.json）としてダウンロードします">出力（作業ファイル）</button>
            <button type="button" id="canvas-export-sprite" class="tool-btn" title="ゲームで使うスプライトを、JS（.js）のファイルとしてダウンロードします">出力（エンジン用）</button>
            <div class="canvas-file-row">
                <button type="button" id="canvas-open-file" class="tool-btn" title="作業ファイル（.ozve.json）、またはエンジン用に出力したスプライト（.js）を新しいキャンバスとして開きます">開く</button>
                <button type="button" id="canvas-import" class="tool-btn" title="作業ファイル（.ozve.json）、またはエンジン用に出力したスプライト（.js）の図形を、開いているキャンバスへ追加します">インポート</button>
            </div>
            <input type="file" id="canvas-open-file-input" accept=".json,.js,application/json,text/javascript" hidden>
            <input type="file" id="canvas-import-file-input" accept=".json,.js,application/json,text/javascript" hidden>
            <div id="canvas-list" class="canvas-list"></div>
            <p id="canvas-notice" class="canvas-notice" hidden></p>
            <p id="canvas-file-notice" class="canvas-notice" hidden></p>
        </div>
    </div>
    <div id="window-dev-panel" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">開発者用：作業データ</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <div class="dev-button-row">
                <button type="button" id="dev-export" class="tool-btn">JSONへ変換</button>
                <button type="button" id="dev-import" class="tool-btn">JSONから復元</button>
            </div>
            <textarea id="dev-json" rows="14" spellcheck="false"></textarea>
            <pre id="dev-result"></pre>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
