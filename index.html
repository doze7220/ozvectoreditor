<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ Vector Editor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9f9f9;
        }
        #editor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: #ffffff;
        }
        /* 共通フロートウィンドウ規格（WindowManagerの管理対象）: 個々のウィンドウはこのクラス群に準拠する */
        .float-window {
            position: fixed;
            z-index: 10;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: -2px 0 6px rgba(0,0,0,0.1);
            font-family: sans-serif;
            user-select: none;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            background-color: #f0f0f0;
            cursor: move;
        }
        .window-title {
            flex: 1;
        }
        .window-close-btn {
            border: none;
            background: none;
            font-size: 14px;
            line-height: 1;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
        }
        .window-close-btn:hover {
            color: #333;
        }
        .window-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #window-control-panel {
            top: 16px;
            right: 16px;
            width: 220px;
        }
        /* topはコントロールパネルの取り消し・やり直しボタン行（1行分）の追加に合わせて320px→368pxへ下げた
           （パネル下端 約341px との余白を24px以上確保するため。自動配置はしない） */
        #window-shape-palette {
            top: 368px;
            right: 16px;
            width: 220px;
        }
        /* SELECTモード中など非活性化させたい.float-windowに付与する（クリック不可＋半透明化） */
        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .tool-btn {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fafafa;
            cursor: pointer;
            text-align: left;
        }
        /* 押せる状態のボタンのみホバー色を変える（押せない状態＝:disabledでは色を変えない） */
        .tool-btn:hover:not(:disabled) {
            background-color: #eee;
        }
        /* ボタン単体の押せない状態（HTMLのdisabled属性。例：選択集合が空の削除ボタン）。
           フロートウィンドウ全体を非活性化する.disabledクラスとは別物 */
        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .tool-btn.active {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* コントロールパネルの表示倍率行（倍率表示＋リセットボタン） */
        .view-zoom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        /* コントロールパネルの取り消し・やり直しボタン行（2ボタンを1行に横並び。
           パネル内側196pxに2ボタン＋余白8pxで収める。押せない状態は.tool-btn:disabledを用いる） */
        .history-button-row {
            display: flex;
            gap: 8px;
        }
        .history-button-row .tool-btn {
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }
        /* 開発者向け確認用ウィンドウ（?dev時のみ表示。右側のコントロールパネル・図形パレットと重ならない左上に置く） */
        #window-dev-panel {
            top: 16px;
            left: 16px;
            width: 360px;
        }
        .dev-button-row {
            display: flex;
            gap: 8px;
        }
        /* .float-windowのuser-select: noneは変更せず、テキスト欄・結果表示欄に限って文字の選択を許可する */
        #dev-json {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            user-select: text;
        }
        #dev-result {
            margin: 0;
            max-height: 120px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            user-select: text;
        }
    </style>
</head>
<body>
    <canvas id="editor-canvas"></canvas>
    <div id="window-control-panel" class="float-window">
        <div class="window-header">
            <span class="window-title">OZ Vector Editor</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="mode-select" class="tool-btn active" title="選択 (V)">🖱 選択</button>
            <button type="button" id="mode-create" class="tool-btn" title="図形作成 (P)">✏ 図形作成</button>
            <button type="button" id="mode-pan" class="tool-btn" title="キャンバス移動 (H)">✋ キャンバス移動</button>
            <button type="button" id="selection-delete" class="tool-btn" title="選択中の図形を削除 (Delete / Backspace)" disabled>🗑 削除</button>
            <div class="history-button-row">
                <button type="button" id="history-undo" class="tool-btn" title="取り消し (Ctrl+Z)" disabled>↶ 取り消し</button>
                <button type="button" id="history-redo" class="tool-btn" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷ やり直し</button>
            </div>
            <div class="view-zoom-row">
                <span id="view-zoom-display">100%</span>
                <button type="button" id="view-reset" class="tool-btn" title="表示をリセット (Ctrl+0)">リセット</button>
            </div>
        </div>
    </div>
    <div id="window-shape-palette" class="float-window disabled">
        <div class="window-header">
            <span class="window-title">図形選択パレット</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="palette-line" class="tool-btn" title="直線 (1)">／ 直線</button>
            <button type="button" id="palette-curve" class="tool-btn" title="曲線 (2)">〜 曲線</button>
            <button type="button" id="palette-arc" class="tool-btn" title="弧 (3)">◠ 弧</button>
            <button type="button" id="palette-rect" class="tool-btn" title="矩形 (4)">▭ 矩形</button>
            <button type="button" id="palette-circle" class="tool-btn" title="円 (5)">◯ 円</button>
        </div>
    </div>
    <div id="window-dev-panel" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">開発者用：作業データ</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <div class="dev-button-row">
                <button type="button" id="dev-export" class="tool-btn">JSONへ変換</button>
                <button type="button" id="dev-import" class="tool-btn">JSONから復元</button>
            </div>
            <textarea id="dev-json" rows="14" spellcheck="false"></textarea>
            <pre id="dev-result"></pre>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
