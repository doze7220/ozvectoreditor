<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ Vector Editor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f9f9f9;
        }
        #editor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: #ffffff;
        }
        /* 共通フロートウィンドウ規格（WindowManagerの管理対象）: 個々のウィンドウはこのクラス群に準拠する */
        .float-window {
            position: fixed;
            z-index: 10;
            background-color: #ffffff;
            border: 1px solid #ccc;
            box-shadow: -2px 0 6px rgba(0,0,0,0.1);
            font-family: sans-serif;
            user-select: none;
        }
        .window-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            min-height: 18px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            background-color: #f0f0f0;
            cursor: move;
        }
        .window-title {
            flex: 1;
        }
        .window-close-btn {
            border: none;
            background: none;
            font-size: 14px;
            line-height: 1;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
        }
        .window-close-btn:hover {
            color: #333;
        }
        .window-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #window-control-panel {
            top: 16px;
            right: 16px;
            width: 220px;
        }
        /* topはコントロールパネルのキャンバス名の表示行・呼び出し口ボタンの追加に合わせて368px→440pxへ下げた
           （変更前のパネル下端 約341px＋追加分 約70px（キャンバス名の行18px＋行間8px＋呼び出し口ボタン約36px＋行間8px）
           ＝新しい下端 約411px。440−411＝約29pxで、余白24px以上を確保するため。自動配置はしない） */
        #window-shape-palette {
            top: 440px;
            right: 16px;
            width: 220px;
        }
        /* SELECTモード中など非活性化させたい.float-windowに付与する（クリック不可＋半透明化） */
        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .tool-btn {
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fafafa;
            cursor: pointer;
            text-align: left;
        }
        /* 押せる状態のボタンのみホバー色を変える（押せない状態＝:disabledでは色を変えない） */
        .tool-btn:hover:not(:disabled) {
            background-color: #eee;
        }
        /* ボタン単体の押せない状態（HTMLのdisabled属性。例：選択集合が空の削除ボタン）。
           フロートウィンドウ全体を非活性化する.disabledクラスとは別物 */
        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .tool-btn.active {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* コントロールパネルの表示倍率行（倍率表示＋リセットボタン） */
        .view-zoom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        /* コントロールパネルの取り消し・やり直しボタン行（2ボタンを1行に横並び。
           パネル内側196pxに2ボタン＋余白8pxで収める。押せない状態は.tool-btn:disabledを用いる） */
        .history-button-row {
            display: flex;
            gap: 8px;
        }
        .history-button-row .tool-btn {
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }
        /* コントロールパネルの開いているキャンバスの名前の表示（呼び出し口の直上の1行。
           長い名前は省略表示し、名前全体はmain.jsがtitle属性に設定する） */
        .canvas-name-display {
            font-size: 12px;
            line-height: 18px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* キャンバスパレット（呼び出し口#launcher-canvasで開閉。hidden属性で初期非表示）。
           コントロールパネルの左隣に置く（right: コントロールパネルのright 16px＋幅220px＋間隔16px＝252px）。
           ?devの確認用ウィンドウ（left: 16px・幅360px）とは、画面幅が約870px以上なら重ならない */
        #window-canvas-palette {
            top: 16px;
            right: 252px;
            width: 240px;
        }
        /* キャンバスパレットの一覧（キャンバス数が多い場合はパレット内で縦スクロールする） */
        .canvas-list {
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* 一覧の1行（名前のボタン＋名前の変更・削除の小さなボタンを横並び） */
        .canvas-row {
            display: flex;
            gap: 4px;
        }
        /* 行の名前のボタン（押すと開く）。残りの幅を使い、長い名前は省略表示する（名前全体はtitle属性） */
        .canvas-row-open {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 行の名前の変更（✎）・削除（🗑）の小さなボタン（伸縮させない。押せない状態は.tool-btn:disabledを用いる） */
        .canvas-row-btn {
            flex: none;
        }
        /* 開いているキャンバスの行の名前のボタン（.tool-btn.activeと同じ配色） */
        .canvas-row.current .canvas-row-open {
            background-color: #dbe9ff;
            border-color: #6699ff;
            font-weight: bold;
        }
        /* キャンバスパレットのファイル操作の行（書き出し・開く・インポートの3ボタンを横並び）。
           パレットの内側は216px（幅240px−余白24px）。文字13px×(4+2+5)字＋余白・枠30px＋行間8pxで約181pxのため1行に収まる */
        .canvas-file-row {
            display: flex;
            gap: 4px;
        }
        .canvas-file-row .tool-btn {
            flex: 1 1 auto;
            padding: 8px 4px;
            text-align: center;
            white-space: nowrap;
        }
        /* キャンバスパレットの保存・読み込みの問題（#canvas-notice）とファイル操作の通知（#canvas-file-notice）の短い文言
           （無いときはhidden属性で非表示）。区切りの無い長いファイル名がパレットからはみ出さないよう、どこでも折り返す */
        .canvas-notice {
            margin: 0;
            font-size: 12px;
            color: #b00020;
            overflow-wrap: anywhere;
        }
        /* 読み込み中の覆い要素（キャンバス全面を覆い、読み込み完了までキャンバスへのマウス入力を遮る）。
           表示状態で始まり（main.jsの実行前から遮るため）、main.jsのsyncLoadingCover()が読み込み完了でhidden属性を付けて非表示にする。
           z-index: 5はキャンバス（1）より前面・フロートウィンドウ（10以上。最前面化でも下がらない）より背面のため、
           コントロールパネル・パレット・?devの確認用ウィンドウは読み込み中も操作できる */
        .canvas-loading-cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 14px;
            color: #666;
            cursor: progress;
            user-select: none;
        }
        /* 必須：上のdisplay: flexがhidden属性の既定の非表示（display: none）を上書きするため、hidden時の非表示を明示する */
        .canvas-loading-cover[hidden] {
            display: none;
        }
        /* 開発者向け確認用ウィンドウ（?dev時のみ表示。右側のコントロールパネル・図形パレットと重ならない左上に置く） */
        #window-dev-panel {
            top: 16px;
            left: 16px;
            width: 360px;
        }
        .dev-button-row {
            display: flex;
            gap: 8px;
        }
        /* .float-windowのuser-select: noneは変更せず、テキスト欄・結果表示欄に限って文字の選択を許可する */
        #dev-json {
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            user-select: text;
        }
        #dev-result {
            margin: 0;
            max-height: 120px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            user-select: text;
        }
    </style>
</head>
<body>
    <canvas id="editor-canvas"></canvas>
    <div id="canvas-loading-cover" class="canvas-loading-cover">読み込み中…</div>
    <div id="window-control-panel" class="float-window">
        <div class="window-header">
            <span class="window-title">OZ Vector Editor</span>
        </div>
        <div class="window-body">
            <button type="button" id="mode-select" class="tool-btn active" title="選択 (V)">🖱 選択</button>
            <button type="button" id="mode-create" class="tool-btn" title="図形作成 (P)">✏ 図形作成</button>
            <button type="button" id="mode-pan" class="tool-btn" title="キャンバス移動 (H)">✋ キャンバス移動</button>
            <button type="button" id="selection-delete" class="tool-btn" title="選択中の図形を削除 (Delete / Backspace)" disabled>🗑 削除</button>
            <div class="history-button-row">
                <button type="button" id="history-undo" class="tool-btn" title="取り消し (Ctrl+Z)" disabled>↶ 取り消し</button>
                <button type="button" id="history-redo" class="tool-btn" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷ やり直し</button>
            </div>
            <div class="view-zoom-row">
                <span id="view-zoom-display">100%</span>
                <button type="button" id="view-reset" class="tool-btn" title="表示をリセット (Ctrl+0)">リセット</button>
            </div>
            <div id="canvas-name-display" class="canvas-name-display"></div>
            <button type="button" id="launcher-canvas" class="tool-btn" title="キャンバスパレットを開く／閉じる">📁 キャンバス</button>
        </div>
    </div>
    <div id="window-shape-palette" class="float-window disabled">
        <div class="window-header">
            <span class="window-title">図形選択パレット</span>
        </div>
        <div class="window-body">
            <button type="button" id="palette-line" class="tool-btn" title="直線 (1)">／ 直線</button>
            <button type="button" id="palette-curve" class="tool-btn" title="曲線 (2)">〜 曲線</button>
            <button type="button" id="palette-arc" class="tool-btn" title="弧 (3)">◠ 弧</button>
            <button type="button" id="palette-rect" class="tool-btn" title="矩形 (4)">▭ 矩形</button>
            <button type="button" id="palette-circle" class="tool-btn" title="円 (5)">◯ 円</button>
        </div>
    </div>
    <div id="window-canvas-palette" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">キャンバス</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <button type="button" id="canvas-create" class="tool-btn">＋ 新規作成</button>
            <div class="canvas-file-row">
                <button type="button" id="canvas-export" class="tool-btn" title="開いているキャンバスをファイル（.json）としてダウンロードします">書き出し</button>
                <button type="button" id="canvas-open-file" class="tool-btn" title="ファイルを新しいキャンバスとして開きます">開く</button>
                <button type="button" id="canvas-import" class="tool-btn" title="ファイルの図形を開いているキャンバスへ追加します">インポート</button>
            </div>
            <input type="file" id="canvas-open-file-input" accept=".json,application/json" hidden>
            <input type="file" id="canvas-import-file-input" accept=".json,application/json" hidden>
            <div id="canvas-list" class="canvas-list"></div>
            <p id="canvas-notice" class="canvas-notice" hidden></p>
            <p id="canvas-file-notice" class="canvas-notice" hidden></p>
        </div>
    </div>
    <div id="window-dev-panel" class="float-window" hidden>
        <div class="window-header">
            <span class="window-title">開発者用：作業データ</span>
            <button type="button" class="window-close-btn">×</button>
        </div>
        <div class="window-body">
            <div class="dev-button-row">
                <button type="button" id="dev-export" class="tool-btn">JSONへ変換</button>
                <button type="button" id="dev-import" class="tool-btn">JSONから復元</button>
            </div>
            <textarea id="dev-json" rows="14" spellcheck="false"></textarea>
            <pre id="dev-result"></pre>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
